      - name: Build .NET 8 tests
        run: dotnet build Sources/Mailozaurr.Tests/Mailozaurr.Tests.csproj --framework net8.0 --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
